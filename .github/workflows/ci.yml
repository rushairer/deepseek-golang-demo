name: ci

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true
      - name: Normalize modules and format sources
        run: |
          go mod tidy
          gofmt -w .
      - name: Commit generated formatting changes
        if: github.event_name == 'pull_request'
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore: format Go sources"
            git push
          fi
      - run: go vet ./...
      - run: go test -race ./...
